    <script>

        // =====================================================
        // API URL (same Flask server that serves this page)
        // =====================================================

        const API_URL = API_BASE_URL;


        // =====================================================
        // CHOICES.JS
        // =====================================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const selectElement =
                    document.getElementById("ticker");

                if (selectElement) {

                    new Choices(
                        selectElement,
                        {
                            searchEnabled: true,
                            searchChoices: true,
                            itemSelectText: "",
                            placeholder: true,
                            placeholderValue:
                                "Type company name or ticker..."
                        }
                    );

                }

            }
        );


        // =====================================================
        // PREDICT STOCK
        // =====================================================

        async function predictStock() {

            const ticker =
                document.getElementById("ticker").value;

            const open =
                document.getElementById("open").value;

            const high =
                document.getElementById("high").value;

            const low =
                document.getElementById("low").value;

            const close =
                document.getElementById("close").value;

            const volume =
                document.getElementById("volume").value;


            try {

                const response = await fetch(
                    API_URL + "/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            ticker: ticker,

                            open: open,

                            high: high,

                            low: low,

                            close: close,

                            volume: volume

                        })
                    }
                );


                const data =
                    await response.json();


                // If Flask sends an error

                if (!response.ok || !data.success) {

                    alert(
                        data.message ||
                        "Prediction failed."
                    );

                    return;

                }


                // Show result section

                document.getElementById(
                    "result-section"
                ).style.display = "block";


                // Company name

                document.getElementById(
                    "company-name"
                ).innerText =
                    data.company || ticker;


                // Predictions

                document.getElementById(
                    "tomorrow"
                ).innerText =
                    "₹" + data.prediction.tomorrow;


                document.getElementById(
                    "week"
                ).innerText =
                    "₹" + data.prediction.one_week;


                document.getElementById(
                    "month"
                ).innerText =
                    "₹" + data.prediction.one_month;


                document.getElementById(
                    "two_month"
                ).innerText =
                    "₹" + data.prediction.two_month;


                document.getElementById(
                    "six_month"
                ).innerText =
                    "₹" + data.prediction.six_month;

            }


            catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to prediction server."
                );

            }

        }

    </script>
